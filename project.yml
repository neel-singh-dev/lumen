name: Lumen
options:
  bundleIdPrefix: in.neelmani
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

targets:
  Lumen:
    type: application
    platform: macOS
    sources:
      - Lumen
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        # Menu-bar-only app — no Dock icon, like Clicky.
        LSUIElement: true
        NSMicrophoneUsageDescription: "Lumen uses the microphone for push-to-talk voice questions."
        NSSpeechRecognitionUsageDescription: "Lumen transcribes your voice on-device with Apple speech recognition. Audio never leaves this Mac."
        NSRemindersFullAccessUsageDescription: "Lumen saves reminders only when you explicitly ask it to."
        NSAppleEventsUsageDescription: "Lumen creates notes in Apple Notes only when you explicitly ask it to."
        # Allow plain-HTTP to localhost only — for the Ollama fully-local provider.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: NO
        # Stable signing identity so TCC permission grants survive rebuilds.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C4YDYMFG88
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  LumenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - LumenTests
      - Lumen/Core/PointParser.swift
      - Lumen/Core/CostEstimator.swift
      - Lumen/Core/ReplayStore.swift
      - Lumen/Core/ProviderRouting.swift
    settings:
      base:
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C4YDYMFG88
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lumen:
    build:
      targets:
        Lumen: all
        LumenTests: [test]
    run:
      config: Debug
    test:
      targets: [LumenTests]
